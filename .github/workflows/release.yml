name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependencies
        run: npm install

      # The checks that are invisible in the source and obvious in the browser.
      # A release that fails them is a release nobody can use.
      - name: Verify
        run: npm run check

      - name: Derive version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp module.json
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg v "$VERSION" --arg repo "$REPO" '
            .version = $v
            | .url      = "https://github.com/" + $repo
            | .manifest = "https://github.com/" + $repo + "/releases/latest/download/module.json"
            | .download = "https://github.com/" + $repo + "/releases/download/v" + $v + "/module.zip"
          ' module.json > module.tmp && mv module.tmp module.json
          cat module.json

      # Rebuilt rather than taken from the repo, so the shipped pack always
      # matches packs/_source.
      - name: Build compendium packs
        run: npm run build:packs

      - name: Zip
        run: |
          rm -f packs/*/LOCK
          zip -r module.zip module.json README.md LICENSE scripts templates styles lang packs \
            -x "packs/_source/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
